included:
  - App
  - AppTests
  - Packages/TableKit/Sources
  - Packages/TableKit/Tests
excluded:
  - Packages/TableKit/.build
  - build
  - Scripts

disabled_rules:
  - todo
  - optional_data_string_conversion  # lossy UTF-8 decoding is intentional for wire data
  - opening_brace  # conflicts with multi-line guard/else formatting used in the codebase

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_optional_binding
  - vertical_parameter_alignment_on_call
  - yoda_condition

trailing_comma:
  mandatory_comma: true
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 600
  error: 800
type_body_length:
  warning: 400
  error: 500
function_body_length:
  warning: 80
  error: 120
cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true
identifier_name:
  min_length: 2
  excluded: [id, x, y, a, b, c, i, j, n, op, ok]
nesting:
  type_level: 3
large_tuple:
  warning: 3
type_name:
  max_length: 50
