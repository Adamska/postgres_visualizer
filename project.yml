name: TablePlusPlus
options:
  bundleIdPrefix: io.tableplusplus
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  TableKit:
    path: Packages/TableKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  TablePlusPlus:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: TableKit
        product: TableCore
      - package: TableKit
        product: TablePostgres
      - package: TableKit
        product: TableStorage
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Table++
        CFBundleDisplayName: Table++
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Table++"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes: []
    settings:
      base:
        PRODUCT_NAME: Table++
        PRODUCT_MODULE_NAME: TablePlusPlus
        PRODUCT_BUNDLE_IDENTIFIER: io.tableplusplus.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication

  TablePlusPlusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: TablePlusPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tableplusplus.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Table++.app/Contents/MacOS/Table++"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TablePlusPlus:
    build:
      targets:
        TablePlusPlus: all
        TablePlusPlusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TablePlusPlusTests
      gatherCoverageData: false
