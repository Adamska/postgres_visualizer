name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: macos-26
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tablepp
          POSTGRES_PASSWORD: tablepp
          POSTGRES_DB: tablepp
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tablepp -d tablepp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app || sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Seed the test database
        run: psql "postgres://tablepp:tablepp@localhost:54329/tablepp" -v ON_ERROR_STOP=1 -f Scripts/seed.sql

      - name: Lint
        run: swiftlint lint --strict --quiet

      - name: Package tests (unit + integration)
        working-directory: Packages/TableKit
        env:
          TABLEPP_TEST_DATABASE_URL: postgres://tablepp:tablepp@localhost:54329/tablepp
        run: swift test

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: App build and tests
        run: |
          set -o pipefail
          xcodebuild -project TablePlusPlus.xcodeproj -scheme TablePlusPlus -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- test | Scripts/build-filter.sh
