[package]
name = "tableplusplus"
version = "0.1.0"
description = "Table++: a polished PostgreSQL client for macOS"
authors = ["Table++"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tableplusplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["runtime"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# `strip = true` breaks proc-macro dylibs on recent macOS (mis-aligned LINKEDIT); Tauri's bundler strips the final binary.
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
